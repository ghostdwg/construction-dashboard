name: CI / Deploy

# ── DORMANT FLY DEPLOYMENT PLANE — Phase R4.5 safety patch ────────────────
# This workflow describes the Fly.io deployment plane for the GroundWorX
# app and sidecar. Fly is NOT the active production deployment plane:
# Docker Compose on host `superglitch` is authoritative (see
# Migration/Production Runtime Assessment.txt and Migration/ARCHITECTURE_V1).
#
# The deploy-app and deploy-sidecar jobs are intentionally disabled via
# `if: false` to prevent accidental activation if a FLY_API_TOKEN secret
# is ever added to the repo. typecheck and build remain active as ordinary
# CI validation — they do not deploy anything.
#
# Re-enabling requires:
#   1. An explicit architectural decision recorded in `planning/`.
#   2. Verification that the dormant Fly entities are still appropriate.
#   3. Coordination with the active Docker Compose deploy plane.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "libsql://placeholder.turso.io"
          DATABASE_AUTH_TOKEN: "placeholder"
      - name: Type check
        run: npm run typecheck

  build:
    name: Build
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "libsql://placeholder.turso.io"
          DATABASE_AUTH_TOKEN: "placeholder"
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "libsql://placeholder.turso.io"
          DATABASE_AUTH_TOKEN: "placeholder"
          AUTH_SECRET: "placeholder-auth-secret-minimum-32-chars-xx"
          ANTHROPIC_API_KEY: "sk-ant-placeholder"
          NEXTAUTH_URL: "https://neuroglitch.ai"

  deploy-app:
    name: Deploy — neuroglitch-app
    needs: build
    runs-on: ubuntu-latest
    # Phase R4.5: Fly deploy plane disabled. See top-of-file note.
    # Original condition (for future reference if Fly is ever reactivated):
    #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy main app
        run: flyctl deploy --remote-only --config runtime/fly/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-sidecar:
    name: Deploy — neuroglitch-sidecar
    needs: build
    runs-on: ubuntu-latest
    # Phase R4.5: Fly deploy plane disabled. See top-of-file note.
    # Original condition (for future reference if Fly is ever reactivated):
    #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy sidecar
        run: flyctl deploy --remote-only --config runtime/fly/fly.sidecar.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
