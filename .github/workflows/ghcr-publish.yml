name: GHCR Publish

# ──────────────────────────────────────────────────────────────────────────────
#  Phase O1.5.f — Canonical GHCR image publish pipeline.
#
#  PURPOSE
#    Produce immutable container artifacts at ghcr.io/ghostdwg/groundworx-{app,
#    sidecar,worker}:<git-sha> for every commit landed on a governed branch.
#
#    Closes the chain:
#      git SHA  →  CI workflow  →  signed GHCR manifest  →  staging runtime
#
#  WHAT THIS DOES
#    * Builds three images in parallel via a matrix.
#    * Pushes them to GHCR ONLY on `push` events to a governed branch.
#    * On `pull_request` events, builds without pushing — validates the
#      Dockerfile compiles cleanly without polluting the registry.
#    * Tags every image with the immutable git SHA.
#    * Tags with the sanitized branch name on push events.
#    * Tags with `:latest` ONLY on push-to-main (per O1.5.f requirement
#      "DO NOT push latest from feature branches").
#    * Generates SBOM + SLSA build-provenance attestations and uploads them
#      alongside the image in GHCR.
#    * Verifies the pushed manifest is reachable from the registry.
#
#  WHAT THIS DOES NOT DO
#    * Does NOT deploy. Does NOT mutate staging or production.
#    * Does NOT restart containers, recreate compose services, or run
#      migrations against any environment.
#    * Does NOT publish images from any feature branch other than the one
#      explicitly listed below.
#    * Does NOT replace `.github/workflows/ci.yml` or `deploy.yml`. Those
#      remain authoritative for typecheck / test / build verification. The
#      Fly deploy jobs in `deploy.yml` stay dormant per the existing
#      Phase R4.5 safety patch.
#    * Does NOT build the cron container (runtime/cron/Dockerfile). The
#      cron image is built locally on superglitch via `docker compose build
#      cron` per the Phase A runbook; promote to a 4th matrix entry only
#      when an explicit decision is made to publish cron via GHCR.
# ──────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/mi-10-operator-workspace

permissions:
  contents: read       # checkout
  packages: write      # push to ghcr.io under the repo owner namespace
  id-token: write      # OIDC token used for SLSA build-provenance attestation
  attestations: write  # write attestation records to the repo

env:
  REGISTRY: ghcr.io
  OWNER: ghostdwg

jobs:
  publish:
    name: Build & publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false  # one image failing does not abort the others
      matrix:
        image:
          - name: groundworx-app
            context: .
            dockerfile: Dockerfile
          - name: groundworx-sidecar
            context: sidecar
            dockerfile: sidecar/Dockerfile
          - name: groundworx-worker
            # NOTE: runtime/worker/Dockerfile is the scaffold image; the
            # currently-deployed worker on superglitch is built from a host
            # Dockerfile. Publishing this scaffold satisfies staging.active.yml's
            # `image: ghcr.io/ghostdwg/groundworx-worker:${APP_SHA}` reference.
            # If the production worker is later migrated to runtime/worker/,
            # no workflow change is needed.
            context: runtime/worker
            dockerfile: runtime/worker/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=UNLICENSED
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.description=NeuroGlitch GroundWorX ${{ matrix.image.name }} — built from ${{ github.repository }}@${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and conditionally push) ${{ matrix.image.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}

      - name: Attest build provenance (SLSA)
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify pushed manifest reachable
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}:${{ github.sha }}"
          echo "Inspecting ${IMG}..."
          docker buildx imagetools inspect "${IMG}" > /tmp/manifest.txt
          head -40 /tmp/manifest.txt
          echo "---"
          echo "OK — ${IMG} manifest accessible from GHCR (digest=${{ steps.build.outputs.digest }})"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.image.name }}"
            echo ""
            echo "- **Event:** \`${{ github.event_name }}\`"
            echo "- **Ref:** \`${{ github.ref }}\`"
            echo "- **SHA:** \`${{ github.sha }}\`"
            echo "- **Pushed to GHCR:** \`${{ github.event_name == 'push' }}\`"
            echo "- **Tags computed:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
              echo "- **Pull command:**"
              echo '```bash'
              echo "docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}:${{ github.sha }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
