x-groundworx-upload-mount: &groundworx-upload-mount
  type: bind
  source: "${GROUNDWORX_UPLOADS_DIR:-/opt/neuroglitch/uploads/groundworx}"
  target: /app/uploads

services:
  app:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      SIDECAR_URL: "${SIDECAR_URL:-http://sidecar:8001}"
    depends_on:
      - db
      - sidecar
    volumes:
      - *groundworx-upload-mount
    restart: unless-stopped
    networks:
      - internal

  sidecar:
    build:
      context: ../sidecar
      dockerfile: Dockerfile
    expose:
      - "8001"
    env_file:
      - .env.production
    volumes:
      - *groundworx-upload-mount
    restart: unless-stopped
    networks:
      - internal

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: groundworx
      POSTGRES_USER: gwxuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
